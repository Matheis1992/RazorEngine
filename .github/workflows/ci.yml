name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # .NET Framework 4.8 tests need a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'src/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/RazorEngine.sln

      - name: Check release notes match the package version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/source/RazorEngine.Core/RazorEngine.Core.csproj -getProperty:Version
          $heading = Get-Content doc/ReleaseNotes.md | Where-Object { $_ -match '^###\s' } | Select-Object -First 1
          if ($heading -notmatch [regex]::Escape($version)) {
            throw "The newest heading in doc/ReleaseNotes.md ('$heading') does not mention version $version from RazorEngine.Core.csproj."
          }

      - name: Build
        run: dotnet build src/RazorEngine.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/RazorEngine.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Pack
        run: dotnet pack src/RazorEngine.sln --configuration Release --no-build --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts
